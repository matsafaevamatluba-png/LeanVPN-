
name: Build LeanVPN APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find Android project
        shell: bash
        run: |
          FILE=$(find . -name settings.gradle -not -path './.git/*' -print -quit)
          if [ -z "$FILE" ]; then
            echo "settings.gradle not found"
            exit 1
          fi
          ROOT=$(dirname "$FILE")
          if [ ! -d "$ROOT/app" ]; then
            echo "app folder not found in $ROOT"
            find . -maxdepth 4 -type d
            exit 1
          fi
          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LeanVPN-debug-apk
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
